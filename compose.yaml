# Runs on the LinuxONE VM: podman-compose up -d --build
services:
  db:
    image: docker.io/library/postgres:16
    environment:
      POSTGRES_USER: controlroom
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: controlroom
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

  server:
    build:
      context: .
      dockerfile: server/Containerfile
    environment:
      DATABASE_URL: postgresql://controlroom:${POSTGRES_PASSWORD}@db:5432/controlroom
      ENGINE: ${ENGINE:-auto}
      LLM_URL: http://llm:8080
    ports:
      - "8000:8000"
    depends_on:
      - db
    restart: unless-stopped

  # M3 analyst: Granite 3.3 2B on llama.cpp. Start with: podman-compose up -d llm
  # Needs ~/models/granite-3.3-2b-instruct-be.gguf from ai/llm/prepare_model.sh.
  llm:
    image: localhost/controlroom-llm:latest
    build:
      context: ai/llm
      dockerfile: Containerfile
    volumes:
      - ${HOME}/models:/models:ro
    ports:
      - "127.0.0.1:8080:8080"
    restart: unless-stopped

volumes:
  pgdata:
